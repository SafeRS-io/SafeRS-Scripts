# Checks every script manifest on push and pull request. Needs no secrets;
# publishing itself happens on the SafeRS side when you push to main.
name: Validate scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate.mjs
